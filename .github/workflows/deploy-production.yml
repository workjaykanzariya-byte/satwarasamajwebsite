name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Application
        run: npm --prefix frontend run build

      - name: Setup SSH Key & Agent
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.PROD_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 22 }} -H "${{ secrets.PROD_SSH_HOST || '200.234.34.55' }}" >> ~/.ssh/known_hosts

      - name: Deploy Frontend dist to public_html (rsync --delete)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 22 }}" \
            --exclude='.htaccess' \
            ./frontend/dist/ ${{ secrets.PROD_SSH_USER || 'root' }}@${{ secrets.PROD_SSH_HOST || '200.234.34.55' }}:/home/satwaramahamandal.org/public_html/

      - name: Deploy Backend Source to VPS (rsync --delete with exclusions)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 22 }}" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='logs' \
            ./backend/ ${{ secrets.PROD_SSH_USER || 'root' }}@${{ secrets.PROD_SSH_HOST || '200.234.34.55' }}:"${{ secrets.PROD_DEPLOY_PATH || '/var/www/satwaramahamandal/Satvara Samaj Website' }}/backend/"

      - name: Sync Root Scripts & Configs
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 22 }}" \
            ./scripts/ ${{ secrets.PROD_SSH_USER || 'root' }}@${{ secrets.PROD_SSH_HOST || '200.234.34.55' }}:"${{ secrets.PROD_DEPLOY_PATH || '/var/www/satwaramahamandal/Satvara Samaj Website' }}/scripts/"

      - name: Execute Backend Dependencies, Prisma Generate & PM2 Restart
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 22 }} ${{ secrets.PROD_SSH_USER || 'root' }}@${{ secrets.PROD_SSH_HOST || '200.234.34.55' }} << 'EOF'
            set -e
            cd "/var/www/satwaramahamandal/Satvara Samaj Website/backend"
            
            echo "📦 Installing Production Backend Dependencies..."
            npm ci --omit=dev
            
            echo "⚙️ Generating Prisma Client..."
            npx prisma generate
            
            echo "🔄 Restarting PM2 Application (satwara-backend)..."
            pm2 restart satwara-backend --update-env
            pm2 save
          EOF

      - name: Post-Deployment Server Health Checks
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 22 }} ${{ secrets.PROD_SSH_USER || 'root' }}@${{ secrets.PROD_SSH_HOST || '200.234.34.55' }} << 'EOF'
            set -e
            echo "🔍 Running Post-Deployment Health Verification..."
            
            echo "1. PM2 Application Status:"
            pm2 status satwara-backend
            
            echo "2. Backend Port 5000 Listener Check:"
            ss -ltnp | grep :5000 || (echo "❌ Backend port 5000 not listening!" && exit 1)
            
            echo "3. Local Frontend Host Verification:"
            curl -I -s http://127.0.0.1/ -H "Host: satwaramahamandal.org" | head -n 5
            
            echo "4. Local Backend Health API Verification:"
            curl -i -s http://127.0.0.1:5000/api/v1/health | head -n 10
            
            echo "5. Public Production HTTPS Domain Check:"
            curl -4 -k -I -s https://satwaramahamandal.org/ | head -n 5
            
            echo "6. Public Production API Endpoint Check:"
            curl -k -fsS https://satwaramahamandal.org/api/v1/health
            
            echo ""
            echo "✅ All Production Health Checks Passed Successfully!"
          EOF
